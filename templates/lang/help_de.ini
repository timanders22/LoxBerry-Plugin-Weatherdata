[HILFE]
K01="Weatherdata holt Prognosen von Open-Meteo und amtliche Warnungen vom DWD, liest wahlweise die Station ueber die Ecowitt-Weiche und meldet alles ueber das MQTT-Gateway V2. Standort und Warnzelle traegt man im Reiter Einstellungen selbst ein. Das Plugin ist eine Zusatzinformation und ersetzt keine amtlichen Warnkanaele. wttr.in und der Emulator des Loxone-Wetterdienstes sind ab Werk aus; der Emulator stammt nicht von Loxone und geht bei Gen. 2 ab Config 16 nicht."
