[HILFE]
K01="Weatherdata holt Prognosen von Open-Meteo und amtliche Warnungen vom DWD, liest wahlweise die Station ueber die Ecowitt-Weiche und meldet alles ueber das MQTT-Gateway V2. Standort und Warnzelle traegt man im Reiter Einstellungen selbst ein. Das Plugin ist eine Zusatzinformation und ersetzt keine amtlichen Warnkanaele. wttr.in und der Emulator des Loxone-Wetterdienstes sind ab Werk aus; der Emulator stammt nicht von Loxone und geht bei Gen. 2 ab Config 16 nicht. Ab 0.9.10 schaetzt es auf Wunsch (ab Werk aus) ohne Konto den Ertrag der eigenen Solaranlage fuer heute und morgen und gibt ihn unter haus/pv an andere Plugins (Reiter Quellen, Abschnitt PV-Prognose); das ist eine Schaetzung, die man ueber einige Wochen mit der eigenen Anlage vergleicht. Ab 0.9.11 rechnet sie grob Schnee auf flachen Modulen (Prognose ab 2 cm: diese Stunde 0) und oertlichen Schatten morgens oder abends (dann nur diffuses Himmelslicht) ein, nimmt den Temperaturkoeffizienten aus dem Moduldatenblatt und gibt zusaetzlich die Stundenreihen heute und morgen sowie haus/pv/schnee weiter."
