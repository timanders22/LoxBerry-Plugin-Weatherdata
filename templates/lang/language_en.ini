HILFE="Own station shows values from your station, from Wunderground or from Loxone; weather services shows the forecast for now (sentence above this text). Clearly different (coloured) from: temperature and dew point 3 degrees, humidity 15 percentage points, wind 15 km/h, gust 25 km/h, rain 2 mm per hour, radiation 300 W/m², UV index 2, air pressure 3 hPa. This is a hint, not an error: a model calculates for an area, the station measures at one point. If a value stays clearly different for hours, check the sensor and its placement (sun, wall, dirt). Air pressure: compared with the sea-level pressure from Open-Meteo, because stations usually show the pressure reduced to sea level (relative); a difference of 3 hPa more likely comes from a wrongly set altitude or the absolute instead of the relative value than from the weather. Without Open-Meteo the pressure is not marked. Wind direction: shortest angle (0 to 180 degrees); in calm wind (below 2 km/h at the station or the service) a dash; never marked. Raining now: a station with a piezo rain gauge (such as WS90) reports “rain” itself; the rain rate is a separate field and is rounded to 0.1 mm per hour. 1 at 0.0 mm per hour is therefore possible and not a reading error. A missing value shows a dash."
FUSS_OM="Open-Meteo now – the mix does not know this value."
QUELLE="The comparison uses the mixed value of the current hour from all forecasts that are answering – the same mix as the forecast: temperature weighted by the error record (only after 14 days of your own station, equal weights before), rain the median. The mix does not know dew point, air pressure and wind direction; they come from the current value of Open-Meteo. In this plugin Open-Meteo is the only forecast with its own current value for all quantities, needs no key for non-commercial use and picks the model itself (“best match”), in Central Europe according to its documentation among others the DWD models ICON-D2 and ICON-EU (read on 05.11.2026)."
