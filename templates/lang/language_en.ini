[EMU]
H="Emulator of the Loxone weather service"
H_BRAUCHEN="Do you need this?"
B1_T="You want to see the weather in the Loxone app?"
B1="Then use the Weather page tab. It is simpler and needs no change to your network."
K_B1="Go to Weather page"
B2_T="You want to switch things with weather values (shading, irrigation, heating)?"
B2="Then use MQTT. The steps are in the Integration in Loxone tab, the settings in the MQTT tab."
K_B2="Go to Integration"
B3_T="Only if you want to fill Loxone’s built-in weather display:"
B3="That is what this emulator is for. It needs a change to the name resolution of your network, which not every router can do."
ABO="Contract and subscription, please read: the emulator reports a subscription end date to the Miniserver (31 December of next year). According to the Weather4Lox wiki the app then no longer shows a hint about the Loxone weather subscription. Check yourself whether this fits your contract with Loxone; the plugin gives no assurance about it."
H_SELBST="Self-check"
RELEASE="Weatherdata release page"
PROFI="For experienced users: as root on the LoxBerry"
S4_FRITZ="Option b, for all devices at home: the FRITZ!Box hands your own name server to all devices via DHCP. Click path according to AVM: Home Network, Network, tab Network Settings, Change Advanced Network Settings, tab IPv4, in the DHCP section enter the address of your own name server in the field “Local DNS server”, Apply. The Miniserver only gets it if it uses automatic network configuration (DHCP). According to AVM, on these devices the FRITZ!Box user interface then no longer opens via fritz.box, only via its address."
S4_DNSMASQ="Recommended way: your own name server at home that points both names to the address of the LoxBerry. That can be Pi-hole, AdGuard Home or DNSmasq. On the LoxBerry itself, according to the Weather4Lox wiki, the LoxBerry plugin DNSmasq does this (not measured with Weatherdata). Enter two lines there: address=/weather.loxone.com/LoxBerry-IP and address=/weather-beta.loxone.com/LoxBerry-IP."
K_DNSMASQ="DNSmasq wiki page"
S4_EIGEN="Pi-hole or AdGuard Home: add both names there as local entries pointing to the address of the LoxBerry."
H_FEHLER="If it does not work"
F1="Port 6066 set up: no. Repeat step 3. If a message above says the port is taken, switch off the Weather4Lox emulator first."
F2="Prepared hours: 0. Is the switch on and the location set? Press Query services now in the Test tab and wait a minute."
F3="Last request stays empty even after an hour: the name redirection does not work, or the weather server is not switched on in Loxone Config. Check the Miniserver’s name server and generation."
F4="Requests arrive but the app shows nothing: restart the Miniserver. Generation 2 from Config 16 does not work at all."
F5="Going back: switch off, save and install the plugin again. Port 6066 is then free again. Uninstalling also cleans up."
DATENSCHUTZ="Privacy: the emulator only hands out weather data, never the location you entered; longitude, latitude and sun times refer only to the request itself. By default it answers only the Miniservers registered in LoxBerry. Serial number and location of the request go into no log."
S4_A="Then first option a, the smallest change: only the Miniserver asks this name server. In Loxone Config configure the Miniserver, section Network: choose “Use static address”, enter IP address, netmask and default gateway as before, and in the field “DNS server” the address of your own name server (with DNSmasq: the address of the LoxBerry). Do not enter the FRITZ!Box as “Alternative DNS server”, or the Miniserver gets Loxone’s real address there. Save to the Miniserver. The FRITZ!Box stays unchanged, its DNS rebind protection does not matter. Keep in mind: if your own name server is off, the Miniserver can no longer look up internet names. Field names taken from the German language file of Loxone Config, not measured on the Miniserver."
K_AVM_DNS="AVM: Configuring different DNS servers in the FRITZ!Box"
S4_REBIND="DNS rebind protection: if the Miniserver keeps asking the FRITZ!Box and the box passes the question on to your own name server, its protection may reject a home network address for an internet name. Then add both names as an exception, click path according to AVM: Home Network, Network, tab Network Settings, Change Advanced Network Settings, tab DNS Rebind Protection, Add Exception, weather.loxone.com weather-beta.loxone.com (separated by a space), Apply, then restart the FRITZ!Box (System, Backup, Restart FRITZ!Box). With option a this is not needed."
K_AVM_REBIND="AVM: DNS rebind protection"
S4_NICHT="Two ways that do not help here: changing a device name in the FRITZ!Box (Home Network, Network, Network Connections) only names a device in the home network; weather.loxone.com cannot be reproduced that way. A hosts file only applies to the computer it is on; the Miniserver has none."
S4_UNGEMESSEN="None of these ways has been measured with Weatherdata on a Miniserver. The FRITZ!Box click paths are as on the AVM pages (read 2026-11-05, current FRITZ!OS); older FRITZ!OS versions may differ."
[WU]
H="Wunderground (own station)"
