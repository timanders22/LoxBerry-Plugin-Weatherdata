[PV]
H="PV forecast without an account (haus/pv)"
TEXT="Estimates the output of your solar system for today and tomorrow from the Open-Meteo radiation forecast and passes it on to other plugins (topic haus/pv). No account, no key. How to: 1. Tick the box below. 2. Enter power, tilt and orientation for each roof area. 3. Save. After a few minutes the table appears here. It is an estimate: compare it over a few weeks with what your system really produces and then adjust the efficiency."
FLAECHEN_HILFE="Up to four areas, for example east and west roof separately. An area with power 0 stays unused. Each used area is one request per hour to Open-Meteo."
SCHNEE_HILFE="Snow: if the forecast has at least 2 cm of snow on the ground for an hour, the plugin counts areas flatter than 60 degrees as 0 for that hour. This is rough: the forecast does not know whether or when the snow slides off or melts from your modules. Steeper areas (for example on a wall) are calculated as usual."
