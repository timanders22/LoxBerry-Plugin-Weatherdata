WO="Why is WetterOnline missing although Weather4Lox offers it? WetterOnline has no public interface. Weather4Lox uses addresses meant for the WetterOnline app. Such addresses can change at any time, and the WetterOnline terms (version of 24.02.2025, section 2) forbid unauthorised copying and storing of the content. So the service is not built in here. If you have a contract with WetterOnline, please get in touch."
