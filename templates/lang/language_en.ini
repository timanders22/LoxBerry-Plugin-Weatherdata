[HAUS]
H="Weather for other plugins (haus/wetter)"
TEXT="Other plugins read this summary, for example the voice control plugin for questions like “Do I need an umbrella?”. How to: 1. Tick “Share the weather with other plugins” above and save. 2. In the voice control plugin, tick “Answer weather questions” on its MQTT tab and save. 3. After at most two minutes it answers. The line below and the row “Weather for other plugins” on the Test tab show whether it works."
