[LOXW]
H="Send your own measurements from Loxone to Weatherdata"
WAS="If your Miniserver has its own sensors (such as a Loxone weather station, an outside sensor, an anemometer or a rain sensor), it can deliver the values here. Weatherdata uses them for the current values as long as no own station (switch, direct, receive or Wunderground) delivers the value. The forecast is not touched. Off by default."
ECHO_T="Important, or a value goes round in circles:"
ECHO="Only send values of real sensors. Never a value that comes from Weatherdata itself (Virtual Inputs whose name starts with the MQTT prefix, such as weatherdata_jetzt_temp_c), and with the emulator switched on not the values of the Loxone weather service either. If a value comes back in step with its own, Weatherdata does not accept it and shows below: feedback loop."
H_SCHRITTE="Step by step"
S1="Tick Accept measurements from Loxone above and press Save."
S2="Download the template for the Virtual Output. It contains all addresses with your token; treat the file like a password and download it again after Create new token."
S3="In Loxone Config click Virtual Outputs in the tree on the left, choose Predefined devices and then Import template in the ribbon and open the file. This creates the output Weatherdata measurements with one command per value. The address in the head of the output is a suggestion: check that the Miniserver reaches the LoxBerry under this name, otherwise enter the address of the LoxBerry."
S4="Drag only the commands for which you have a sensor onto a page and connect the sensor to the input of the command. The value must arrive in the unit of the table; if your anemometer delivers m/s, multiply by 3.6 with a formula block first."
S5="Save to the Miniserver."
S6="Reload this page: the table shows valid and the last value for each value. The Values tab shows loxone as origin."
K_VORLAGE="Download Virtual Output template"
H_TABELLE="Addresses per value"
TABELLE_HILFE="This is the command on ON of each command if you create it by hand: address of the output http://LoxBerry-IP, untick Use as digital output. Weatherdata checks every value like the station: range, for the temperature also jumps and the distance to the forecast."
