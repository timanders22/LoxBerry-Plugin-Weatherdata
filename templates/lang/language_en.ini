[HILFE]
mb_key="Free per provider: one year, about 2,500 calls. The plugin asks up to once an hour, so that lasts less than four months. As of 2026-11-05."
tm_key="Free per the provider help page: 500 calls a day, 25 an hour. The plugin asks at most once an hour. As of 2026-11-05."
vc_key="Free per price page: 30,000 records a month, attribution mandatory. The page also mentions a limit per 24 hours and does not say how hourly data counts; one call an hour may exceed it. As of 2026-11-05."
wa_key="Free per price page: 100,000 calls a month, 3 days of forecast. The plugin asks at most once an hour. As of 2026-11-05."
ow_key="Per provider 1,000 calls a day free, paid per call above that; One Call 3.0 needs its own subscription. The plugin asks at most once an hour. As of 2026-11-05."
ma_emma="Easiest with the button directly above. Empty: all warnings of the country."
ma_land="Outside Germany only. The names belong to the Meteoalarm feeds. A value already entered stays valid."
nina_ars="Easiest with the search directly above. By hand: twelve digits from the list of municipalities of the Federal Statistical Office."
station_host2="For type Direct only, optional. Leave empty for Weiche and Receive."
station_host1="For type Direct only. Leave empty for Weiche and Receive."
station_ordner="Stays ecowittweiche unless the Weiche lies in another folder."
emu_nur_ms="On by default. Any other device gets 403. List from the LoxBerry settings."
emu_ein="Off by default. Prepares the answer and opens the endpoint. Port and name resolution are separate steps, see above."
wttr_ein="Further source for the mix, off by default, no key. One-person service without any commitment and without stated data terms. Fetched at most every three hours, the answer comes in 3-hour steps. The location always goes out with 2 decimals. Gusts are often high; the mix takes the largest gust, so storm signals can come earlier."
lat="For example 50.123, with a point. How to find it: open the map link below, enter your address and press „Search“ (or click your house). Under „Decimal degrees (DD)“ you see both numbers, such as „50.123, 8.456“. Simply paste them together here; the plugin splits them when saving. Empty: no forecast."
lon="The second number from the map, for example 8.456, with a point. Leave empty if you entered both numbers together above."
pos_stellen="How precisely the location goes to the services: 2 means about 1 km, 3 about 100 m, 4 about 10 m. Less reveals less about you and is enough for weather. wttr.in always gets 2 decimals, even if more is set here."
warnzelle="Number of your municipality at the German weather service. Easiest: enter the location, save, then press Suggest warning cell. Empty: no warnings. Germany only."
prog_max_alter_min="If the forecast is older, Loxone shows a dash instead of the old value."
warn_max_alter_min="If the warning source is older, the warning level shows a dash: no warning and nothing known are different."
hitze1_c="Default 32."
hitze2_c="Default 35."
hitze3_c="Default 38."
sturm_vor_min="The lead time comes from the start of the DWD warning and is short or 0 for sudden thunderstorms."
lueften_innen_min_c="Inside value from Loxone via wd.php, else the indoor sensor of the station. No inside value, no statement."
lueften_letzte="Shortly before quiet hours, if it only cools down at night."
om_apikey="Only needed for commercial use. Home automation works without it: per provider, asking without a key is free for non-commercial use, 10,000 calls a day. As of 2026-11-05."
station_ein="Without the station the plugin runs without it. The current forecast value is then used, marked as a substitute in the values."
a_warn="Level 3 thunderstorm, hurricane and torrential rain, and everything at level 4, also speak at night."
mqtt_topic="weatherdata by default. Changing it changes all names in Loxone."
station_art="Weiche: via the Ecowitt-Weiche plugin, nothing else to enter. Direct: the plugin asks the station itself at the addresses below. Receive: the station sends its values to this plugin itself."
mosmix_ein="Second forecast source for the mix."
met_ein="Third source, CC BY 4.0."
bias_ein="Subtracts the usual deviation of a source from your station. Only from 14 days of comparison. Off by default."
fassade_az="Up to four, degrees per Open-Meteo: 0 south, -90 east, 90 west, 180 north. How to measure: open the azimuth tool below, find your house, switch to the aerial view, choose „Orthogonales Messen“ (orthogonal measuring) and click along the house wall so that the arrow points outwards. The degrees shown (deviation from south) fit here unchanged; separate several with commas."
aq_ein="Model value, not a measurement."
pollen_region="Names and numbers from the German weather service, read on 2026-11-05; the names exist in German only. A value already entered stays valid. The region cannot be derived from the warning cell, so please choose it yourself."
ow_ein="Paid from call 1 001 per price page."
vc_ein="Attribution is mandatory."
mb_ein="The free access lasts one year per provider."
hysterese_k="A signal only switches off again once the value has dropped this many degrees below the threshold. This prevents constant toggling."
wu_ein="Off by default. Current values only, never the forecast. A station on this LoxBerry (switch, direct or receive) takes precedence."
wu_station="As Wunderground names your station: upper case and digits, found under My Devices."
wu_key="Shown on the API Keys page of your Wunderground account. The key stays on this LoxBerry: not in the backup file, not in the log."
lox_ein="Off by default. Only switch on if Loxone really has its own sensors. The addresses below also require the token."
lox_gueltig_min="Loxone only sends a value when it changes. If nothing arrives for this long, Weatherdata uses the forecast again. 30 minutes as for the inside value; longer for wind and rain, which often stay the same for a long time."
haus_wetter_ein="Off by default. Tick it if, for example, the voice control plugin (from 0.12.13) should answer questions about the weather. Weatherdata then places a small weather summary for other plugins in the MQTT broker every minute: temperature now, today and tomorrow, rain, warning level and pollen – never your location. Only works if “Send values via MQTT” is ticked. Nothing needs to be set up in Loxone. Untick and save to remove the summary from the broker again."
haus_pv_ein="Off by default. Estimates from the Open-Meteo radiation forecast how much your solar system will produce today and tomorrow – no account, no key. It reaches other plugins only if „Send values via MQTT“ is on in the MQTT tab. Switching it on does no harm: only one plugin per house may send under haus/pv, and PV Solcast NG does not send there (it uses its own topic, by default solcast/). Both forecasts can therefore run side by side. Leave it off only if another plugin already sends under haus/pv."
pv1_name="Any name, for example „south roof“ or „garage“. Display only."
pv1_kwp="Peak power of the modules on this area in kilowatt-peak (see your offer or invoice, for example 9.9). 0 = area not used."
pv1_neigung="How steep the modules are: 0 = lying flat, 90 = vertical on a wall. A typical pitched roof has 30 to 45 degrees."
pv1_az="Where the modules face: 0 = south, -90 = east, 90 = west, 180 = north; values in between such as -45 (south-east) are allowed. How to measure: open the azimuth tool below, find your house, switch to the aerial view, choose „Orthogonal measuring“ and click along the lower roof edge (eaves) of the module area so that the arrow points away from the roof in the direction the modules face. The degree value shown (deviation from south) fits here unchanged."
pv1_schatten_morgen="From when does the sun really shine on the modules? If a tree, a neighbouring house or a hill stands in front in the morning, enter the time from which the modules are clear. Check once in summer and once in winter; the value is an average. Until then the plugin only counts the diffuse sky light. Rough: the sun's path moves over the year, in winter the shade lasts longer. Empty = no shade."
pv1_schatten_abend="As above, for the evening: from when are the modules in shade? Check once in summer and once in winter; the value is an average. Empty = no shade."
pv_faktor="What remains of the radiation after cables, inverter, dirt and ageing. 0.85 suits most systems. If the forecast is always too high over a few weeks, lower it (for example 0.80); if too low, raise it. The plugin accounts for module heating itself."
pv_temp_beiwert="How much the output drops in heat. The module data sheet lists it as “temperature coefficient Pmax”, for example -0.38 %/°C – enter it without the minus: 0.38. Allowed 0.20 to 0.50. Without a data sheet, keep 0.38."
pv_wr_max_w="More than the inverter can deliver never reaches the house (for example 8000 for an 8 kW unit). 0 = no limit."
