BRAUCHT_NICHT="If your own station is already connected to this plugin via the Ecowitt switch, directly or by receiving (section Own station above), you do not need this: those values are fresher and need no internet."
S1="Sign in to Wunderground and copy your station ID under My Devices."
S2="On the API Keys page let a key be created if there is none yet, and copy it."
S3="Tick the box here, enter ID and key, press Save."
S4="After 10 minutes at the latest the table above shows OK for Wunderground. If it says key rejected, the key was copied wrongly."
