B_JETZT="Jetzt: Temperatur und gefühlt in °C, Feuchte in %, Wind und Böen in km/h, Regen ja (1) oder nein (0), Regenmenge in mm je Stunde"
B_HEUTE="Heute ab jetzt: Tiefst- und Höchstwert in °C, Regen in mm, Regenwahrscheinlichkeit in %, Wettercode und Wetter in Worten"
B_MORGEN="Morgen: dieselben Werte für den ganzen Tag"
B_WARNUNG="Amtliche Warnstufe 0 bis 4 und kurzer Name der Warnung („keine“ ohne Warnung)"
B_POLLEN="Stärkste Pollenbelastung heute (0 bis 3) und welche Pflanze („keine“ ohne Pollenflug)"
