EMU_S6="Prüfen: Die Tabelle unten zeigt die letzte Abfrage."
EMU_S5="Loxone Config: unter Projekt den Wetterserver einschalten, Miniserver neu starten. Er fragt laut Weather4Lox-Wiki einmal je Stunde."
EMU_S4="Namensauflösung: weather.loxone.com und weather-beta.loxone.com müssen für den Miniserver auf die Adresse des LoxBerry zeigen, etwa über Ihren Router oder einen eigenen Nameserver. Der Miniserver muss diesen Nameserver benutzen (Miniserver konfigurieren, Netzwerk). Das Plugin richtet keinen Nameserver ein."
EMU_S3="Port 6066 öffnen, der Miniserver fragt fest diesen Port: einmal als root den ersten Befehl unten, oder das Plugin bei eingeschaltetem Schalter erneut einspielen. Das Plugin ändert den Apache nicht still, es gibt keine sudo-Regel und keinen Dauerdienst. Ausschalten: Schalter aus und zweiter Befehl. Die Deinstallation räumt ab."
