[HILFE]
mb_key="Laut Anbieter frei: ein Jahr, rund 2 500 Aufrufe. Das Plugin fragt bis zu einmal je Stunde, das reicht also keine vier Monate. Stand 05.11.2026."
tm_key="Laut Hilfeseite des Anbieters frei: 500 Aufrufe je Tag, 25 je Stunde. Das Plugin fragt höchstens einmal je Stunde. Stand 05.11.2026."
vc_key="Laut Preisseite frei: 30 000 Records je Monat, Namensnennung Pflicht. Die Seite nennt auch eine Grenze je 24 Stunden und sagt nicht, wie stündliche Daten zählen; bei einem Abruf je Stunde kann sie reißen. Stand 05.11.2026."
wa_key="Laut Preisseite frei: 100 000 Aufrufe je Monat, 3 Tage Vorhersage. Das Plugin fragt höchstens einmal je Stunde. Stand 05.11.2026."
ow_key="Laut Anbieter 1 000 Aufrufe je Tag kostenlos, darüber je Aufruf bezahlt; One Call 3.0 braucht ein eigenes Abo. Das Plugin fragt höchstens einmal je Stunde. Stand 05.11.2026."
ma_emma="Am einfachsten mit dem Knopf direkt darüber. Leer: alle Warnungen des Landes."
ma_land="Nur außerhalb Deutschlands. Die Namen gehören zu den Feeds von Meteoalarm. Ein schon eingetragener Wert bleibt gültig."
nina_ars="Am einfachsten mit der Suche direkt darüber. Von Hand: zwölf Ziffern aus der Gemeindeliste des Statistischen Bundesamts."
station_host2="Nur bei Art Direkt, wahlweise. Bei Weiche und Empfang leer lassen."
station_host1="Nur bei Art Direkt. Bei Weiche und Empfang leer lassen."
station_ordner="Bleibt ecowittweiche, solange die Weiche nicht in einem anderen Ordner liegt."
emu_nur_ms="Ab Werk an. Fragt ein anderes Gerät, bekommt es 403. Liste aus den LoxBerry-Einstellungen."
emu_ein="Ab Werk aus. Bereitet die Antwort vor und öffnet den Endpunkt. Port und Namensauflösung sind eigene Schritte, siehe oben."
wttr_ein="Weitere Quelle für die Mischung, ab Werk aus, ohne Schlüssel. Einzelbetrieb ohne Zusage und ohne genannte Datenbedingungen. Abruf höchstens alle drei Stunden, die Antwort kommt in 3-Stunden-Schritten. Der Standort geht immer mit 2 Nachkommastellen hin. Die Böen liegen oft hoch; die Mischung nimmt die größte Böe, Sturmsignale können also früher kommen."
lat="Zum Beispiel 50.123, mit Punkt. So finden Sie ihn: unten den Link zur Karte öffnen, Ihre Adresse eingeben und „Suchen“ drücken (oder auf Ihr Haus klicken). Unter „Dezimalgrad (DD)“ stehen beide Zahlen, etwa „50.123, 8.456“. Kopieren Sie sie einfach zusammen hier hinein; das Plugin teilt sie beim Speichern auf. Leer: keine Prognose."
lon="Die zweite Zahl aus der Karte, zum Beispiel 8.456, mit Punkt. Bleibt leer, wenn Sie oben beide Zahlen zusammen eingetragen haben."
pos_stellen="Wie genau der Standort an die Dienste geht: 2 heißt etwa auf 1 km, 3 etwa auf 100 m, 4 etwa auf 10 m. Weniger sagt weniger über Sie aus und reicht für das Wetter. wttr.in bekommt immer 2 Stellen, auch wenn hier mehr steht."
warnzelle="Nummer Ihrer Gemeinde beim Deutschen Wetterdienst. Am einfachsten: Standort eintragen, speichern, dann den Knopf Warnzelle vorschlagen drücken. Leer: keine Warnungen. Nur für Deutschland."
prog_max_alter_min="Ist die Prognose älter, zeigt Loxone einen Strich statt des alten Werts."
warn_max_alter_min="Ist die Warnquelle älter, zeigt die Warnstufe einen Strich: Keine Warnung und nichts bekannt sind verschieden."
hitze1_c="Vorgabe 32."
hitze2_c="Vorgabe 35."
hitze3_c="Vorgabe 38."
sturm_vor_min="Die Vorwarnzeit kommt aus dem Beginn der DWD-Warnung und ist bei kurzfristigen Gewittern kurz oder 0."
lueften_innen_min_c="Innenwert von Loxone über wd.php, sonst Innenfühler der Station. Ohne Innenwert keine Aussage."
lueften_letzte="Kurz vor der Nachtruhe, wenn es erst in der Nacht kühler wird."
om_apikey="Nur für gewerbliche Nutzung nötig. Heimautomation kommt ohne aus: Laut Anbieter ist die Abfrage ohne Schlüssel für nicht-kommerzielle Nutzung frei, 10 000 Aufrufe je Tag. Stand 05.11.2026."
station_ein="Fehlt die Station, läuft das Plugin ohne sie. Dann gilt der Prognosewert für jetzt, in den Werten als Ersatz gekennzeichnet."
a_warn="Stufe 3 Gewitter und Orkan sowie heftiger Starkregen, und alles auf Stufe 4, sprechen auch nachts."
mqtt_topic="Ab Werk weatherdata. Wer ihn ändert, ändert alle Namen in Loxone."
station_art="Weiche: über das Plugin Ecowitt-Weiche, nichts weiter einzutragen. Direkt: Das Plugin fragt die Station selbst an den Adressen unten. Empfang: Die Station meldet ihre Werte selbst an dieses Plugin."
mosmix_ein="Zweite Prognosequelle für die Mischung."
met_ein="Dritte Quelle, CC BY 4.0."
bias_ein="Zieht die gewohnte Abweichung einer Quelle von Ihrer Station ab. Erst ab 14 Tagen Vergleich. Ab Werk aus."
fassade_az="Bis zu vier, Grad nach Open-Meteo: 0 Süd, -90 Ost, 90 West, 180 Nord. So messen Sie sie: unten das Azimut-Werkzeug öffnen, Ihr Haus suchen, in die Luftbildansicht wechseln, „Orthogonales Messen“ wählen und an der Hauswand entlang klicken, sodass der Pfeil nach außen zeigt. Die angezeigte Gradzahl (Abweichung von Süden) passt hier unverändert; mehrere mit Komma trennen."
aq_ein="Modellwert, keine Messung."
pollen_region="Namen und Nummern vom Deutschen Wetterdienst, gelesen am 05.11.2026. Ein schon eingetragener Wert bleibt gültig. Aus der Warnzelle lässt sich die Region nicht herleiten, deshalb bitte selbst wählen."
ow_ein="Laut Preisseite ab Aufruf 1 001 kostenpflichtig."
vc_ein="Namensnennung ist Pflicht."
mb_ein="Der freie Zugang gilt laut Anbieter nur ein Jahr."
hysterese_k="Ein Signal geht erst wieder aus, wenn der Wert um so viele Grad unter die Schwelle gefallen ist. Das verhindert ständiges Hin- und Herschalten."
wu_ein="Ab Werk aus. Nur die aktuellen Werte, nie die Vorhersage. Eine Station auf diesem LoxBerry (Weiche, direkt oder Empfang) geht vor."
wu_station="So, wie Wunderground Ihre Station nennt: Großbuchstaben und Ziffern, zu finden unter Meine Geräte."
wu_key="Steht auf der Seite API Keys Ihres Wunderground-Kontos. Der Schlüssel bleibt auf diesem LoxBerry: nicht in der Sicherungsdatei, nicht im Protokoll."
lox_ein="Ab Werk aus. Erst einschalten, wenn Loxone wirklich eigene Fühler hat. Die Adressen unten verlangen zusätzlich das Token."
lox_gueltig_min="Loxone sendet einen Wert nur, wenn er sich ändert. Kommt so lange nichts, nimmt Weatherdata wieder die Prognose. 30 Minuten wie beim Innenwert; für Wind und Regen, die oft lange gleich bleiben, eher länger."
haus_wetter_ein="Ab Werk aus. Anhaken, wenn zum Beispiel die Sprachsteuerung (ab 0.12.13) Fragen zum Wetter beantworten soll. Weatherdata legt dann jede Minute eine kleine Wetterübersicht für andere Plugins im MQTT-Broker ab: Temperatur jetzt, heute und morgen, Regen, Warnstufe und Pollen – nie Ihren Standort. Wirkt nur, wenn „Werte über MQTT senden“ angehakt ist. In Loxone müssen Sie dafür nichts einrichten. Haken entfernen und speichern räumt die Übersicht im Broker wieder ab."
haus_pv_ein="Ab Werk aus. Schätzt aus der Strahlungsprognose von Open-Meteo, wie viel Ihre Solaranlage heute und morgen erzeugt – ohne Konto und ohne Schlüssel. An andere Plugins geht es nur, wenn im Reiter MQTT „Werte über MQTT senden“ an ist. Nur ein Plugin im Haus soll haus/pv liefern: Wer schon PV Solcast NG oder ein anderes Prognose-Plugin nutzt, braucht das hier nicht unbedingt."
pv1_name="Frei wählbar, zum Beispiel „Süddach“ oder „Garage“. Nur zur Anzeige."
pv1_kwp="Spitzenleistung der Module dieser Fläche in Kilowatt-Peak (steht im Angebot oder auf der Rechnung, zum Beispiel 9,9). 0 = Fläche nicht benutzt."
pv1_neigung="Wie schräg die Module stehen: 0 = flach liegend, 90 = senkrecht an der Wand. Ein übliches Schrägdach hat 30 bis 45 Grad."
pv1_az="Wohin die Module schauen: 0 = Süden, -90 = Osten, 90 = Westen, 180 = Norden; Zwischenwerte wie -45 (Südost) sind erlaubt. So messen Sie es: unten das Azimut-Werkzeug öffnen, Ihr Haus suchen, in die Luftbildansicht wechseln, „Orthogonales Messen“ wählen und an der unteren Dachkante (Traufe) der Modulfläche entlang klicken, sodass der Pfeil vom Dach weg in die Richtung zeigt, in die die Module schauen. Die angezeigte Gradzahl (Abweichung von Süden) passt hier unverändert."
pv1_schatten_morgen="Ab wann scheint die Sonne wirklich auf die Module? Steht morgens ein Baum, ein Nachbarhaus oder ein Berg davor, tragen Sie hier die Uhrzeit ein, ab der die Module frei sind. Einmal im Sommer und einmal im Winter nachsehen; der Wert ist ein Mittel. Bis dahin rechnet das Plugin nur mit dem diffusen Himmelslicht. Grob: Die Sonnenbahn wandert übers Jahr, im Winter steht der Schatten länger. Leer = kein Schatten."
pv1_schatten_abend="Wie oben, für den Abend: ab wann liegen die Module im Schatten? Einmal im Sommer und einmal im Winter nachsehen; der Wert ist ein Mittel. Leer = kein Schatten."
pv_faktor="Was von der Strahlung nach Leitungen, Wechselrichter, Schmutz und Alterung übrig bleibt. 0,85 passt für die meisten Anlagen. Liegt die Prognose über einige Wochen immer zu hoch, kleiner stellen (zum Beispiel 0,80), liegt sie zu tief, größer. Die Erwärmung der Module rechnet das Plugin selbst ein."
pv_temp_beiwert="Wie stark die Leistung bei Hitze sinkt. Steht im Moduldatenblatt als „Temperaturkoeffizient Pmax“, zum Beispiel −0,38 %/°C – eintragen ohne Minus: 0,38. Erlaubt 0,20 bis 0,50. Wer das Datenblatt nicht hat, lässt 0,38."
pv_wr_max_w="Mehr, als der Wechselrichter abgeben kann, kommt im Haus nicht an (zum Beispiel 8000 bei einem 8-kW-Gerät). 0 = nicht begrenzen."
