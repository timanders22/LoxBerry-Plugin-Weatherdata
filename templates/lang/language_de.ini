EMU_T_GEHT="Geht es?"
EMU_T_GEN="Miniserver"
EMU_WAS="Der Miniserver holt die Wetterdaten dann vom LoxBerry, als kämen sie vom Dienst. Die Daten kommen aus dem Prognose-Bestand dieses Plugins. Die Einbindung über MQTT ist davon unabhängig und braucht den Emulator nicht."
EMU_WARN="Ab Werk aus. Der Emulator stammt nicht von Loxone. Prüfen Sie selbst, ob er zu Ihrem Loxone-Vertrag und den Bedingungen des Wetterdienstes passt. Nicht am Miniserver gemessen, nur gegen eine Nachbildung seiner Abfrage; Rückmeldung erbeten."
