[HAUS]
H="Wetter für andere Plugins (haus/wetter)"
TEXT="Diese Übersicht lesen andere Plugins, zum Beispiel die Sprachsteuerung für Fragen wie „Brauche ich einen Schirm?“. So geht es: 1. Oben „Wetter an andere Plugins geben“ anhaken und speichern. 2. In der Sprachsteuerung im Reiter MQTT „Wetterfragen beantworten“ anhaken und speichern. 3. Nach höchstens zwei Minuten antwortet sie. Ob es klappt, zeigt die Zeile darunter und im Reiter Test die Zeile „Wetter für andere Plugins“."
T_THEMA="Thema"
T_BLEIBT="bleibt im Broker"
T_BEDEUTUNG="Bedeutung"
