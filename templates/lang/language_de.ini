EMU_W4L="Installiert ist: %s. Ist dort der Emulator eingeschaltet, belegt er denselben Port; schalten Sie nur einen ein."
EMU_FREMD="Port 6066 ist schon belegt durch: %s. Vermutlich der Emulator von Weather4Lox. Zwei Einträge ließen den Apache nicht mehr starten; das Skript ändert deshalb nichts. Bitte erst dort abschalten."
EMU_S6="Prüfen: Der Miniserver fragt nur einmal je Stunde. Spätestens nach einer Stunde steht unten bei Letzte Abfrage eine Zeit."
EMU_S5="Loxone Config: unter Projekt den Wetterserver einschalten (laut Weather4Lox-Wiki: Projekt, Wetterserver), in den Miniserver speichern und ihn neu starten. Der Ort in der App kommt aus den Projekteinstellungen."
EMU_S4="Namen umleiten: Der Miniserver muss für weather.loxone.com und weather-beta.loxone.com die Adresse Ihres LoxBerry bekommen. Das ist eine Sache Ihres Routers oder Nameservers, nicht dieses Plugins, und nicht jeder Router kann das."
EMU_S3="Port 6066 öffnen, ohne Kommandozeile: das Plugin einmal erneut einspielen, während der Schalter an ist. In LoxBerry die Plugin-Verwaltung öffnen, die ZIP-Datei dieser Fassung auswählen (Release-Seite unten) und installieren; LoxBerry fragt dabei nach der SecurePIN. Ihre Einstellungen bleiben erhalten. Danach zeigt die Selbstprüfung: Port 6066 eingetragen, ja."
EMU_S2="Unten den Schalter Emulator einschalten setzen und Speichern drücken."
EMU_S1="Prüfen Sie in der Tafel oben, ob Ihr Miniserver und Ihre Config-Fassung passen, und lesen Sie den Hinweis zu Vertrag und Abo."
EMU_H_SCHRITTE="Was Sie selbst tun müssen"
EMU_G3_T="Nein. Der Miniserver prüft über HTTPS das Zertifikat. Das Plugin versucht nicht, das zu umgehen. Dort bleibt der Weg über MQTT."
