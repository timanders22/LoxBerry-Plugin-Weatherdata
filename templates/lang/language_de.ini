[EMU]
H="Emulator des Loxone-Wetterdienstes"
H_BRAUCHEN="Brauchen Sie das?"
B1_T="Sie möchten das Wetter in der Loxone-App sehen?"
B1="Dann nehmen Sie den Reiter Wetterseite. Das ist einfacher und braucht keinen Eingriff in Ihr Netz."
K_B1="Zur Wetterseite"
B2_T="Sie möchten mit Wetterwerten schalten (Beschattung, Bewässerung, Heizung)?"
B2="Dann nehmen Sie MQTT. Die Schritte stehen im Reiter Einbindung in Loxone, die Einstellungen im Reiter MQTT."
K_B2="Zur Einbindung"
B3_T="Nur wenn Sie die eingebaute Wetteranzeige von Loxone füllen wollen:"
B3="Dafür ist dieser Emulator. Er braucht einen Eingriff in die Namensauflösung Ihres Netzes, den nicht jeder Router kann."
ABO="Vertrag und Abo, bitte lesen: Der Emulator meldet dem Miniserver ein Abo-Enddatum (31.12. des nächsten Jahres). Laut Wiki von Weather4Lox zeigt die App danach keinen Hinweis auf das Loxone-Wetterabo mehr. Ob das zu Ihrem Vertrag mit Loxone passt, prüfen Sie selbst; das Plugin gibt dazu keine Zusage."
H_SELBST="Selbstprüfung"
RELEASE="Release-Seite von Weatherdata"
PROFI="Für Geübte: als root auf dem LoxBerry"
S4_FRITZ="Möglichkeit b, für alle Geräte im Heimnetz: Die FRITZ!Box gibt den eigenen Nameserver per DHCP an alle Geräte weiter. Klickweg laut AVM: Heimnetz, Netzwerk, Registerkarte Netzwerkeinstellungen, Erweiterte Netzwerkeinstellungen ändern, Registerkarte IPv4, im Abschnitt DHCP im Feld „Lokaler DNS-Server“ die Adresse des eigenen Nameservers eintragen, Übernehmen. Der Miniserver bekommt ihn nur, wenn er auf automatische Netzwerkkonfiguration (DHCP) steht. Laut AVM öffnet sich die FRITZ!Box danach auf diesen Geräten nicht mehr über fritz.box, nur noch über ihre Adresse."
S4_DNSMASQ="Empfohlener Weg: ein eigener Nameserver im Heimnetz, der die beiden Namen auf die Adresse des LoxBerry lenkt. Das können Pi-hole, AdGuard Home oder DNSmasq. Auf dem LoxBerry selbst geht das laut Wiki von Weather4Lox mit dem LoxBerry-Plugin DNSmasq (mit Weatherdata nicht gemessen). Dort zwei Zeilen eintragen: address=/weather.loxone.com/IP-des-LoxBerry und address=/weather-beta.loxone.com/IP-des-LoxBerry."
K_DNSMASQ="Wiki-Seite DNSmasq"
S4_EIGEN="Pi-hole oder AdGuard Home: die beiden Namen dort als lokale Einträge mit der Adresse des LoxBerry anlegen."
H_FEHLER="Wenn es nicht klappt"
F1="Port 6066 eingetragen: nein. Schritt 3 wiederholen. Steht oben die Meldung, der Port sei belegt, zuerst den Emulator von Weather4Lox abschalten."
F2="Vorbereitete Stunden: 0. Ist der Schalter an und der Standort eingetragen? Im Reiter Test Dienste jetzt abfragen drücken und eine Minute warten."
F3="Letzte Abfrage bleibt auch nach einer Stunde leer: Die Umleitung der Namen greift nicht, oder der Wetterserver ist in Loxone Config nicht eingeschaltet. Nameserver des Miniservers und Generation prüfen."
F4="Die Abfrage kommt an, die App zeigt trotzdem nichts: Miniserver neu starten. Generation 2 ab Config 16 geht grundsätzlich nicht."
F5="Zurück: Schalter aus, speichern und das Plugin erneut einspielen. Danach ist Port 6066 wieder frei. Die Deinstallation räumt ebenfalls ab."
DATENSCHUTZ="Datenschutz: Der Emulator gibt nur Wetterdaten heraus, nie den eingetragenen Standort; Länge, Breite und Sonnenzeiten beziehen sich nur auf die Anfrage selbst. Ab Werk antwortet er nur den in LoxBerry eingetragenen Miniservern. Seriennummer und Lage der Abfrage kommen in kein Protokoll."
S4_A="Danach zuerst Möglichkeit a, der kleinste Eingriff: Nur der Miniserver fragt diesen Nameserver. In Loxone Config den Miniserver konfigurieren, Abschnitt Netzwerk: „Statische Adresse verwenden“ wählen, IP Adresse, Netzwerkmaske und Standard Gateway wie bisher eintragen und im Feld „DNS Server“ die Adresse des eigenen Nameservers (bei DNSmasq: die Adresse des LoxBerry). Im Feld „Alternativer DNS Server“ nicht die FRITZ!Box eintragen, sonst bekommt der Miniserver dort die echte Adresse von Loxone. In den Miniserver speichern. Die FRITZ!Box bleibt unverändert, ihr DNS-Rebind-Schutz spielt keine Rolle. Bedenken Sie: Ist der eigene Nameserver aus, findet der Miniserver keine Namen im Internet mehr. Die Feldnamen stammen aus der Sprachdatei von Loxone Config, am Miniserver ungemessen."
K_AVM_DNS="AVM: Andere DNS-Server in FRITZ!Box einrichten"
S4_REBIND="DNS-Rebind-Schutz: Fragt der Miniserver weiter die FRITZ!Box und reicht diese die Frage an den eigenen Nameserver weiter, kann ihr Schutz eine Heimnetz-Adresse für einen Internetnamen abweisen. Dann beide Namen als Ausnahme eintragen, Klickweg laut AVM: Heimnetz, Netzwerk, Registerkarte Netzwerkeinstellungen, Erweiterte Netzwerkeinstellungen ändern, Registerkarte DNS-Rebind-Schutz, Ausnahme hinzufügen, weather.loxone.com weather-beta.loxone.com (durch ein Leerzeichen getrennt), Übernehmen, danach die FRITZ!Box neu starten (System, Sicherung, FRITZ!Box neu starten). Bei Möglichkeit a ist das nicht nötig."
K_AVM_REBIND="AVM: DNS-Rebind-Schutz"
S4_NICHT="Zwei Wege, die hier nicht helfen: Einen Gerätenamen in der FRITZ!Box ändern (Heimnetz, Netzwerk, Netzwerkverbindungen) gibt nur einem Gerät im Heimnetz einen Namen; weather.loxone.com lässt sich so nicht nachbilden. Eine hosts-Datei gilt nur für den Computer, auf dem sie liegt; der Miniserver hat keine."
S4_UNGEMESSEN="Keiner dieser Wege ist mit Weatherdata an einem Miniserver gemessen. Die Klickwege der FRITZ!Box stehen so auf den AVM-Seiten (gelesen am 05.11.2026, aktuelles FRITZ!OS); ältere FRITZ!OS-Fassungen können abweichen."
[WU]
H="Wunderground (eigene Station)"
NUR="Nur für Stationsbetreiber, die Daten an Wunderground senden. Den Schlüssel gibt es kostenlos im eigenen Konto:"
BRAUCHT_NICHT="Wer die eigene Station schon über die Ecowitt-Weiche, direkt oder per Empfang an dieses Plugin angebunden hat (Abschnitt Eigene Station oben), braucht das nicht: Diese Werte sind frischer und kommen ohne Internet."
S1="Bei Wunderground anmelden und unter Meine Geräte die Kennung Ihrer Station abschreiben."
S2="Auf der Seite API Keys einen Schlüssel erzeugen lassen, falls noch keiner da ist, und ihn kopieren."
S3="Hier den Haken setzen, Kennung und Schlüssel eintragen, Speichern drücken."
S4="Nach spätestens 10 Minuten zeigt die Tabelle oben bei Wunderground: in Ordnung. Steht dort Schlüssel abgelehnt, ist der Schlüssel falsch abgeschrieben."
TAKT="Das Plugin fragt höchstens alle 10 Minuten, auch auf Knopfdruck nicht öfter, nach Fehlern seltener. Wie viele Abfragen Wunderground erlaubt, steht in den Bedingungen Ihres Schlüssels; eine amtliche Zahl haben wir nicht gefunden."
[LOXW]
H="Eigene Messwerte von Loxone an Weatherdata senden"
WAS="Hat Ihr Miniserver eigene Fühler (etwa eine Loxone-Wetterstation, einen Außenfühler, einen Windmesser oder einen Regensensor), kann er die Werte hier abliefern. Weatherdata nimmt sie für die aktuellen Werte, solange keine eigene Station (Weiche, direkt, Empfang oder Wunderground) den Wert liefert. Die Vorhersage bleibt unberührt. Ab Werk aus."
ECHO_T="Wichtig, sonst dreht sich ein Wert im Kreis:"
ECHO="Schicken Sie nur Werte echter Fühler. Nie einen Wert, der von Weatherdata selbst kommt (Virtuelle Eingänge, deren Name mit dem MQTT-Präfix beginnt, etwa weatherdata_jetzt_temp_c), und bei eingeschaltetem Emulator auch nicht die Werte des Loxone-Wetterdienstes. Kommt ein Wert im Gleichtakt mit dem eigenen zurück, nimmt Weatherdata ihn nicht an und zeigt unten: Rückkopplung."
H_SCHRITTE="Schritt für Schritt"
S1="Oben den Haken Messwerte von Loxone annehmen setzen und Speichern drücken."
S2="Die Vorlage für den Virtuellen Ausgang herunterladen. Sie enthält alle Adressen mit Ihrem Token; behandeln Sie die Datei wie ein Passwort und laden Sie sie nach Token neu erzeugen erneut."
S3="In Loxone Config im Baum links Virtuelle Ausgänge anklicken, im Menüband Vordefinierte Geräte und dann Vorlage Importieren wählen und die Datei öffnen. Es entsteht der Ausgang Weatherdata Messwerte mit einem Befehl je Wert. Die Adresse im Kopf des Ausgangs ist ein Vorschlag: Prüfen Sie, ob der Miniserver den LoxBerry unter diesem Namen erreicht, sonst die Adresse des LoxBerry eintragen."
S4="Nur die Befehle auf eine Seite ziehen, für die Sie einen Fühler haben, und den Fühler mit dem Eingang des Befehls verbinden. Der Wert muss in der Einheit der Tabelle ankommen; liefert Ihr Windmesser m/s, vorher mit einem Formel-Baustein mal 3,6 rechnen."
S5="In den Miniserver speichern."
S6="Hier die Seite neu laden: In der Tabelle steht je Wert gültig und der letzte Wert. Im Reiter Werte steht bei Herkunft loxone."
