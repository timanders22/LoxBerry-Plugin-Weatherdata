EMU_WARN="Ab Werk aus. Der Emulator stammt nicht von Loxone. Prüfen Sie selbst, ob er zu Ihrem Loxone-Vertrag und den Bedingungen des Wetterdienstes passt. Nicht am Miniserver gemessen, nur gegen eine Nachbildung seiner Abfrage; Rückmeldung erbeten."
