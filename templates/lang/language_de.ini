[Q2]
NINA_WOZU="NINA ist die Warn-App des Bundes. Weatherdata holt daraus Meldungen, die nicht das Wetter betreffen (etwa Hochwasser, Großbrand, Gefahrstoffe), für den Landkreis Ihrer Gemeinde."
NINA_BED="Bedingung: Die Meldungen dürfen nur unverändert und nicht gewerblich verwendet werden; das Plugin gibt den Wortlaut unverändert weiter."
ARS_FELD="Gemeinde suchen"
K_UEBERNEHMEN="Übernehmen und speichern"
MA_BED="Bedingung: Nutzung erlaubt mit Quellenangabe (wie CC BY 4.0 mit Zusatzregeln, die das Plugin erfüllt)."
SCHL_BED="Jeder dieser Dienste braucht ein eigenes Konto mit Schlüssel. Nach der Anleitung des Dienstes gebaut, ohne Schlüssel nie gegen eine echte Antwort geprüft. Wer einschaltet, klärt die Bedingungen des Dienstes selbst."
[PV]
H="PV-Prognose ohne Konto (haus/pv)"
TEXT="Schätzt aus der Strahlungsprognose von Open-Meteo die Leistung Ihrer Solaranlage für heute und morgen und gibt sie an andere Plugins weiter (Thema haus/pv). Kein Konto, kein Schlüssel. So geht es: 1. Unten den Haken setzen. 2. Je Dachfläche Leistung, Neigung und Ausrichtung eintragen. 3. Speichern. Nach ein paar Minuten steht hier die Tabelle. Es ist eine Schätzung: Vergleichen Sie sie über einige Wochen mit dem, was Ihre Anlage wirklich erzeugt, und passen Sie dann den Wirkungsgrad an."
FLAECHEN_HILFE="Bis zu vier Flächen, zum Beispiel Ost- und Westdach getrennt. Eine Fläche mit Leistung 0 bleibt unbenutzt. Jede benutzte Fläche ist eine Anfrage je Stunde bei Open-Meteo."
SCHNEE_HILFE="Schnee: Sagt die Prognose für eine Stunde mindestens 2 cm Schnee am Boden, rechnet das Plugin für Flächen flacher als 60 Grad in dieser Stunde mit 0. Das ist grob: Ob und wann der Schnee von Ihren Modulen rutscht oder taut, weiß die Prognose nicht. Steilere Flächen (zum Beispiel an der Wand) rechnen normal weiter."
