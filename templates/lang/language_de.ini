S3_T="3. Virtuelle Eingänge anlegen"
S3="Die Vorlage legt alle Zahlenwerte als Eingänge an; sie heißen genau wie der Gateway-Name. Danach in Config die Adresse stehen lassen: Sie ist ein Kunstgriff und wird nie abgefragt. Texte brauchen Virtuelle Texteingänge von Hand. Prüfen Sie am Gerät, was ein Eingang aus dem Strich macht, und hängen Sie die Logik an die Themen .../ok."
