M_KEIN_BROKER="Wetter für andere Plugins ist aus. Der MQTT-Broker war nicht erreichbar; der Minutenlauf räumt später ab."
T_AUS="aus – im Reiter MQTT „Wetter an andere Plugins geben“ anhaken, wenn die Sprachsteuerung Wetterfragen beantworten soll."
T_MQTT_AUS="angehakt, aber „Werte über MQTT senden“ ist aus – es geht nichts hinaus."
T_NIE="an – noch keine Sitzung am Broker; der nächste Minutenlauf sendet (höchstens eine Minute)."
