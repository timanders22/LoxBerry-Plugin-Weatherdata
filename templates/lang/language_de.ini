MA_HILFE="Meteoalarm veröffentlicht keine vollständige Ortsliste, nur die Regionen, für die gerade eine Warnung gilt. Der Knopf liest diese einmal ab und bietet sie zur Auswahl an. Steht Ihre Region nicht dabei, lassen Sie das Feld leer: Dann zählen alle Warnungen des Landes."
MA_NUR_AUSSEN="Meteoalarm ist nur für Nutzer außerhalb Deutschlands. In Deutschland gelten die DWD-Warnungen oben."
K_MA_SUCHEN="Regionen mit aktueller Warnung zeigen"
ARS_HILFE="Der Knopf lädt die amtliche Gemeindeliste des Statistischen Bundesamts und sucht nur hier auf dem LoxBerry; Ihr Suchtext verlässt das Gerät nicht. Gefunden wird die Gemeinde; NINA meldet je Landkreis, die Meldungen gelten also für den ganzen Kreis."
K_ARS_SUCHEN="In der amtlichen Liste suchen"
STATION_HILFE="Läuft die Ecowitt-Weiche auf diesem LoxBerry, ist nichts einzutragen: Haken an, Art Weiche, Ordner ecowittweiche. Den Zugangsschlüssel liest das Plugin selbst aus der Weiche. Die beiden Adressen gelten nur für Art Direkt. Für Art Empfang tragen Sie die Adresse weiter unten in der Station ein. Wer das FOSHKplugin nutzt, kann von dort an diese Empfangsadresse weiterleiten."
K_EINTRAGEN="Eintragen"
TREFFER="Treffer"
LISTE_EIGEN="%s (eingetragener Wert, nicht in der Liste)"
BITTE_WAEHLEN="Bitte wählen"
WAS_IST_DAS="Weatherdata liefert Wetterwerte, Prognosen, amtliche Warnungen und fertige Sätze an Loxone: Prognosen von Open-Meteo, vom Deutschen Wetterdienst und vom norwegischen Wetterdienst, Warnungen für Ihre Gemeinde, Pollen, Luft, Regenradar, wahlweise die eigene Station. Keine Station und kein Schlüssel nötig."
PFLICHTHINWEIS="Das Plugin ist eine Zusatzinformation. Fehlt eine Ansage, heißt das nicht, dass keine Gefahr besteht. NINA und amtliche Warnkanäle ersetzt es nicht."
H_STANDORT="Standort und Warnzelle"
STANDORT_HILFE="Beides tragen Sie selbst ein. Das Plugin rät nichts. Der Standort geht gerundet an die eingeschalteten Dienste (ab Werk Open-Meteo, Bright Sky und MET Norway), die Warnzelle an den DWD und im Rückfall an Bright Sky; ins Protokoll und in MQTT kommt beides nie."
H_SCHWELLEN="Eigene Schwellen"
SCHWELLEN_HILFE="Eigene Rechnung, keine amtliche Warnung. 32 und 38 Grad gefühlt lehnen sich an die Stufen des DWD an, 35 Grad ist eine eigene Zwischenstufe. Die amtliche Hitzewarnung läuft getrennt als Warnung."
H_ZEITEN="Abruf und Tageszeiten"
SPEICHERN="Speichern"
K_ZELLE="Warnzelle vorschlagen"
K_ABRUF="Dienste jetzt abfragen"
ZELLE_HILFE="Der Vorschlag fragt Bright Sky mit dem gespeicherten Standort. Eingetragen wird er erst, wenn Sie ihn oben einsetzen und speichern."
GESPEICHERT="Einstellungen gespeichert."
FEHLER="Fehler:"
NICHT_UEBERNOMMEN="Nicht übernommen. Die eingetippten Werte stehen wieder im Formular:"
NOCH_KEIN_LAUF="Noch kein Lauf. Der Minutentakt läuft spätestens in einer Minute."
