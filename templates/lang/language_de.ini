MQTT_HILFE="MQTT-Gateway V2: Virtuelle Eingänge mit dem Gateway-Namen, Haken je Thema laut Hakenliste. Keine Aussage ist ein Strich, nie ein leerer Wert; die Logik hängt an den Zahlenthemen .../ok."
