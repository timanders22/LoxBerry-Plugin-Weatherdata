H_TABELLE="Adressen je Wert"
TABELLE_HILFE="Das ist der Befehl bei EIN des jeweiligen Befehls, falls Sie ihn von Hand anlegen: Adresse des Ausgangs http://IP-des-LoxBerry, Haken Als Digitalausgang verwenden weg. Weatherdata prüft jeden Wert wie die Station: Bereich, bei der Temperatur auch Sprünge und den Abstand zur Prognose."
