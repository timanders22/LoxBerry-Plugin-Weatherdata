GEFUEHLT_HER="eigene Rechnung aus %s: %s"
ART_windchill="Windchill, weil es kalt und windig ist"
ART_hitzeindex="Hitzeindex, weil es warm und feucht ist"
ART_luft="gleich der Lufttemperatur, weder Wind- noch Hitzeeffekt"
HILFE="Eigene Station zeigt Werte Ihrer Station, von Wunderground oder aus Loxone; Wetterdienste zeigt die Vorhersage für jetzt (Satz über diesem Text). Deutlich anders (farbig) ab: Temperatur und Taupunkt 3 Grad, Luftfeuchte 15 Prozentpunkte, Wind 15 km/h, Böe 25 km/h, Regen 2 mm je Stunde, Strahlung 300 W/m², UV-Index 2, Luftdruck 3 hPa. Das ist ein Hinweis, kein Fehler: Ein Modell rechnet für ein Gebiet, die Station misst an einem Punkt. Bleibt ein Wert über Stunden deutlich anders, Fühler und Aufstellung prüfen (Sonne, Wand, Verschmutzung). Luftdruck: verglichen wird mit dem Druck auf Meereshöhe von Open-Meteo, denn Stationen zeigen meist den auf Meereshöhe umgerechneten (relativen) Druck; 3 hPa Unterschied kommen eher von einer falsch eingestellten Höhe oder dem absoluten statt relativen Wert als vom Wetter. Ohne Open-Meteo wird der Druck nicht markiert. Windrichtung: kürzester Winkel (0 bis 180 Grad); bei Windstille (unter 2 km/h an der Station oder im Dienst) ein Strich; nie markiert. Regnet jetzt: Eine Station mit Piezo-Regenmesser (etwa WS90) meldet „Regen“ selbst; die Regenrate ist ein eigenes Feld und wird auf 0,1 mm je Stunde gerundet. 1 bei 0,0 mm je Stunde ist deshalb möglich und kein Lesefehler. Fehlt ein Wert, steht ein Strich."
FUSS_OM="Open-Meteo jetzt – die Mischung kennt diesen Wert nicht."
QUELLE="Verglichen wird mit dem Mischwert der laufenden Stunde aus allen Vorhersagen, die gerade antworten – dieselbe Mischung wie die Prognose: Temperatur nach der Fehlerbilanz gewichtet (erst ab 14 Tagen eigener Station, vorher alle gleich), Regen der Median. Taupunkt, Luftdruck und Windrichtung kennt die Mischung nicht; sie kommen vom Jetzt-Wert von Open-Meteo. Open-Meteo ist im Plugin die einzige Vorhersage mit eigenem Jetzt-Wert für alle Größen, braucht für die nicht-gewerbliche Nutzung keinen Schlüssel und wählt das Modell selbst („best match“), in Mitteleuropa laut seiner Dokumentation unter anderem die DWD-Modelle ICON-D2 und ICON-EU (gelesen am 05.11.2026)."
