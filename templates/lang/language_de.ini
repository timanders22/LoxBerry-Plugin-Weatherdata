[NENNUNG]
WO="Warum fehlt WetterOnline, obwohl Weather4Lox es anbietet? WetterOnline hat keine öffentliche Schnittstelle. Weather4Lox nutzt Adressen, die eigentlich für die WetterOnline-App gedacht sind. Solche Adressen können sich jederzeit ändern, und die AGB von WetterOnline (Fassung vom 24.02.2025, Ziffer 2) untersagen das unberechtigte Vervielfältigen und Speichern der Inhalte. Deshalb ist der Dienst hier nicht eingebaut. Wer einen Vertrag mit WetterOnline hat, möge sich melden."
MA="Warnungen außerhalb Deutschlands: EUMETNET – MeteoAlarm und der nationale Wetterdienst des Landes, Lizenz wie CC BY 4.0. Verzögerungen zwischen dieser Seite und www.meteoalarm.org sind möglich. Die aktuellsten Warnungen der nationalen Wetterdienste stehen auf www.meteoalarm.org."
