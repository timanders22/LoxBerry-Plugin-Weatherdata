[HILFE]
K01="Weatherdata fetches forecasts from Open-Meteo and official warnings from the DWD, optionally reads the station via Ecowitt-Weiche and reports via MQTT gateway V2. Enter location and warning cell yourself in the Settings tab. This plugin is additional information and does not replace official warning channels. wttr.in and the emulator of the Loxone weather service are off by default; the emulator is not from Loxone and does not work on Gen. 2 from Config 16."
