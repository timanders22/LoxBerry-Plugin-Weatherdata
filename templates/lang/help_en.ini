[HILFE]
K01="Weatherdata fetches forecasts from Open-Meteo and official warnings from the DWD, optionally reads the station via Ecowitt-Weiche and reports via MQTT gateway V2. Enter location and warning cell yourself in the Settings tab. This plugin is additional information and does not replace official warning channels. wttr.in and the emulator of the Loxone weather service are off by default; the emulator is not from Loxone and does not work on Gen. 2 from Config 16. From 0.9.10 it can (off by default) estimate the yield of your own solar system for today and tomorrow without an account and share it under haus/pv with other plugins (Sources tab, section PV forecast); it is an estimate to be compared with your own system over a few weeks. From 0.9.11 it roughly accounts for snow on flat modules (forecast of 2 cm or more: that hour counts as 0) and local shade in the morning or evening (then only diffuse sky light), takes the temperature coefficient from the module data sheet and also shares the hourly lists for today and tomorrow and haus/pv/schnee. From 0.9.14 it can estimate (off by default) the heat stress outdoors as WBGT from the existing values; this is an estimate, not a measurement with a black globe."
