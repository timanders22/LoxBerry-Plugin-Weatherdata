<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Main Center Motif: Weatherdata (Wetterdaten & Warnmeldungen) -->
    <g transform="translate(256, 195) scale(1.15)">
      
      <!-- Sun Rays & Arc (Oben links hinter der Wolke) -->
      <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
        <path d="M -76 -32 A 26 26 0 0 1 -28 -66" fill="none" stroke-width="5.5" />
        <line x1="-80" y1="-76" x2="-92" y2="-88" />
        <line x1="-50" y1="-88" x2="-50" y2="-104" />
        <line x1="-18" y1="-80" x2="-8" y2="-92" />
        <line x1="-88" y1="-50" x2="-104" y2="-50" />
        <line x1="-84" y1="-20" x2="-98" y2="-16" />
      </g>

      <!-- Main Cloud Body -->
      <path d="M -70 25 L 35 25 A 26 26 0 0 0 32 -26 A 38 38 0 0 0 -22 -52 A 32 32 0 0 0 -72 -20 A 24 24 0 0 0 -70 25 Z" fill="#ffffff" />

      <!-- Rain Drops (Niederschlagsbalken) -->
      <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
        <line x1="-65" y1="46" x2="-75" y2="70" />
        <line x1="-40" y1="46" x2="-50" y2="70" />
        <line x1="-15" y1="46" x2="-25" y2="70" />
      </g>

      <!-- Severe Weather Warning Triangle (Unten rechts überlagert) -->
      <g transform="translate(48, 38)">
        <!-- Grüner Freistellungs-Rand gegen die Wolke -->
        <path d="M 0 -54 L 44 24 A 9 9 0 0 1 36 36 L -36 36 A 9 9 0 0 1 -44 24 Z" fill="#6dac20" stroke="#6dac20" stroke-width="12" stroke-linejoin="round" />
        
        <!-- Weißes Warndreieck -->
        <path d="M 0 -54 L 44 24 A 9 9 0 0 1 36 36 L -36 36 A 9 9 0 0 1 -44 24 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
        
        <!-- Ausrufezeichen als Negativausschnitt in Plugin-Grün -->
        <rect x="-3.5" y="-19" width="7" height="28" rx="3.5" fill="#6dac20" />
        <circle cx="0" cy="20" r="4.5" fill="#6dac20" />
      </g>
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="0.5">Weatherdata</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>