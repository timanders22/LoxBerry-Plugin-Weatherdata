[AUTHOR]
# Kennung des Plugins, kein Urhebervermerk; darf spaeter nie geaendert werden.
NAME=Weatherdata Plugin Authors
EMAIL=weatherdata@users.noreply.github.com

[PLUGIN]
VERSION=0.9.25
NAME=weatherdata
FOLDER=weatherdata
TITLE=Weatherdata

# Adresse der Dokumentation (seit 0.9.19, Modul-1.2.9-Welle 18.11.2026): LoxBerry liest sie bei der
# Installation (plugininstall.pl, PLUGIN.WEBSITE) und zeigt sie als Knopf "Dokumentation". Besitzer und
# Repository wie in ARCHIVEURL der release.cfg.
WEBSITE=https://github.com/timanders22/LoxBerry-Plugin-Weatherdata

[AUTOUPDATE]
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Weatherdata/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Weatherdata/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
